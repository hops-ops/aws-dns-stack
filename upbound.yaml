apiVersion: meta.dev.upbound.io/v2alpha1
kind: Project
metadata:
  name: aws-dns-stack
spec:
  dependsOn:
  - apiVersion: pkg.crossplane.io/v1
    kind: Function
    package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
    version: '>=v0.6.4'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-helm
    version: '>=v1'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes
    version: '>=v1'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-aws-route53
    version: '>=v2'
  - apiVersion: pkg.crossplane.io/v1
    kind: Configuration
    package: ghcr.io/hops-ops/aws-pod-identity
    version: '>=v0.10.1'
  description: Deploys ExternalDNS + Route53 hosted zones and (optionally) the cert-manager
    integration — a Let's Encrypt DNS-01 ClusterIssuer wired to those zones plus a
    deletion-ordering Usage. cert-manager itself is NOT installed by this stack; pair
    with aws-cert-stack (or another cert-manager install) when spec.certManager.enabled
    is true.
  license: Apache-2.0
  maintainer: Patrick Lee Scott <pat@patscott.io>
  readme: |
    # aws-dns-stack

    ExternalDNS + Route53 hosted zones, plus optional cert-manager
    integration (Let's Encrypt DNS-01 ClusterIssuer wired to the hosted
    zones). cert-manager itself is installed separately — typically via
    aws-cert-stack.
  repository: ghcr.io/hops-ops/aws-dns-stack
  source: github.com/hops-ops/aws-dns-stack
